<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maqueta UI</title>
  <link rel="stylesheet" href="/src/styles/tailwind.css" />
</head>
<body class="min-h-screen bg-(--token-color-bg) text-(--token-color-text)">
  <main class="relative isolate overflow-hidden">
    <!-- capas de background -->
    <div class="absolute inset-0 -z-10 bg-aurora"></div>
    <div class="absolute inset-0 -z-10 bg-grid opacity-40"></div>

    <!-- contenido -->
    <section class="relative z-10 flex min-h-screen flex-col items-center justify-center gap-6 p-8">
      <h1 class="text-3xl font-bold">Maqueta UI</h1>
      <p class="text-white/70">Sistema de tokens composable. Navega a los lienzos de experimentación.</p>

      <nav class="flex flex-wrap gap-3">
        <a
          href="/src/components/atoms/_preview.html"
          class="rounded-lg border border-white/10 bg-white/5 px-5 py-2.5 text-sm transition-colors hover:bg-white/10"
        >
          Átomos
        </a>
        <a
          href="/src/components/molecules/_preview.html"
          class="rounded-lg border border-white/10 bg-white/5 px-5 py-2.5 text-sm transition-colors hover:bg-white/10"
        >
          Moléculas
        </a>
        <a
          href="/src/components/organisms/_preview.html"
          class="rounded-lg border border-white/10 bg-white/5 px-5 py-2.5 text-sm transition-colors hover:bg-white/10"
        >
          Organismos
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
