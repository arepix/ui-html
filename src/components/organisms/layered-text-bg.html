<!-- 
  Organismo: layered-text-bg
  Compone 3 strings tipográficos en capas.
  Atributos por capa: font-family, font-size, font-weight, letter-spacing,
  line-height, color, rotate, skew, opacity, mix-blend-mode.
  Mobile-first: en mobile las capas se escalan y rotan menos.
-->

<section class="layered-text-bg flex h-[60vh] w-full items-center justify-center md:h-[80vh]">
  <!-- Capa 1: BACK - tipografía display gigante, rotada negativa -->
  <span
    class="layered-text-bg__layer 
    layered-text-bg__layer--back 
    -rotate-5 
    text-[18vw] 
    leading-none 
    font-black 
    tracking-tighter 
    text-(--color-aurora-1) 
    mix-blend-screen 
    select-none md:text-[22vw]"
  >
    AURORA
  </span>

  <!-- Capa 2: MID - serif itálica, rotada positiva, blend mode -->
  <span
    class="layered-text-bg__layer 
    layered-text-bg__layer--mid 
    rotate- font-serif text-[10vw] 
    leading-tight font-medium 
    tracking-wide 
    text-(--color-aurora-2) 
    italic mix-blend-overlay 
    select-none md:text-[14vw]"
  >
    typography
  </span>

  <!-- Capa 3: FRONT - mono uppercase, sin rotación, opaco total -->
  <span
    class="layered-text-bg__layer 
    layered-text-bg__layer--front rotate-0 font-mono 
    text-[3vw] leading-none font-bold 
    tracking-[0.2em] text-(--color-text) 
    uppercase mix-blend-normal 
    select-none md:text-[4vw]"
  >
    composition
  </span>
</section>
